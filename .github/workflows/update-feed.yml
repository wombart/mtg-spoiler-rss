name: Update MTG Spoiler RSS Feed

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force_commit:
        description: "Force commit even if no new cards found"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Run feed generator
        id: generate
        env:
          FEED_URL: ${{ vars.FEED_URL || format('{0}/feed.xml', steps.pages.outputs.base_url) }}
        run: python scripts/generate_feed.py

      - name: Commit and push changes
        id: commit
        if: steps.generate.outputs.state_changed == 'true' || steps.generate.outputs.feed_changed == 'true' || inputs.force_commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/feed.xml data/known_cards.json data/known_print_ids.json data/feed_items.json
          git diff --staged --quiet || git commit -m "chore: update MTG spoiler feed [skip ci]"
          git push

      - name: Upload Pages artifact
        if: steps.generate.outputs.feed_changed == 'true' || github.event_name != 'schedule' || inputs.force_commit
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: steps.generate.outputs.feed_changed == 'true' || github.event_name != 'schedule' || inputs.force_commit
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Pushover notification on failure
        if: failure()
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -F "token=$PUSHOVER_TOKEN" \
            -F "user=$PUSHOVER_USER" \
            -F "title=MTG Spoiler RSS Feed failed" \
            -F "message=Workflow '${{ github.workflow }}' failed in repository '${{ github.repository }}'." \
            -F "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "url_title=Open failed GitHub Action" \
            https://api.pushover.net/1/messages.json
