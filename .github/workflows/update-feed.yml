name: Update MTG Spoiler RSS Feed

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force_commit:
        description: "Force commit even if no new cards found"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Run feed generator
        id: generate
        env:
          FEED_URL: ${{ vars.FEED_URL || format('{0}/feed.xml', steps.pages.outputs.base_url) }}
        run: python scripts/generate_feed.py

      - name: Commit and push changes
        id: commit
        if: steps.generate.outputs.state_changed == 'true' || steps.generate.outputs.feed_changed == 'true' || inputs.force_commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/feed.xml data/known_cards.json data/known_print_ids.json data/feed_items.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: update MTG spoiler feed [skip ci]"
          pushed=false
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 10
          done
          if [ "$pushed" != true ]; then
            echo "Push failed after 3 attempts." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: steps.generate.outputs.feed_changed == 'true' || github.event_name != 'schedule' || inputs.force_commit
        # v5 pulls in upload-artifact@v7, which uploads to Actions blob storage; deploy-pages@v5
        # still lists artifacts through the classic API and finds none. Keep v4 (upload-artifact@v4).
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: steps.generate.outputs.feed_changed == 'true' || github.event_name != 'schedule' || inputs.force_commit
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Send Pushover notification when feed changed
        if: steps.generate.outputs.feed_changed == 'true' && success()
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_TITLE: ${{ steps.generate.outputs.notification_title }}
          PUSHOVER_MESSAGE: ${{ steps.generate.outputs.notification_message }}
          FEED_LINK: ${{ steps.pages.outputs.base_url }}/feed.xml
        run: |
          if [ -z "$PUSHOVER_TOKEN" ] || [ -z "$PUSHOVER_USER" ]; then
            echo "Pushover secrets are not configured; skipping notification."
            exit 0
          fi
          curl --fail --silent --show-error \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=$PUSHOVER_TITLE" \
            --form-string "message=$PUSHOVER_MESSAGE" \
            --form-string "url=$FEED_LINK" \
            --form-string "url_title=Open RSS Feed" \
            https://api.pushover.net/1/messages.json

      - name: Send Pushover notification on failure
        if: failure()
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: |
          if [ -z "$PUSHOVER_TOKEN" ] || [ -z "$PUSHOVER_USER" ]; then
            echo "Pushover secrets are not configured; skipping notification."
            exit 0
          fi
          curl --fail --silent --show-error \
            -F "token=$PUSHOVER_TOKEN" \
            -F "user=$PUSHOVER_USER" \
            -F "priority=1" \
            -F "title=MTG Spoiler RSS Feed failed" \
            -F "message=Repository: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Run: #${{ github.run_number }}
          Trigger: ${{ github.event_name }}" \
            -F "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "url_title=Open failed GitHub Action" \
            https://api.pushover.net/1/messages.json



