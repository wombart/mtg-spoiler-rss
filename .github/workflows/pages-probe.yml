name: Pages artifact probe

# Diagnostic workflow: repeats the upload+deploy path in isolation to check for the
# sporadic "Found 0 artifact(s)" artifact metadata failure. It uses the same artifact
# name and concurrency group as the feed workflow, uploads the already published docs/
# directory unchanged and never commits anything.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact (v5 chain)
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        # continue-on-error so a failed first attempt does not mask a successful retry;
        # the sporadic artifact metadata failure would otherwise make the probe flaky.
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry Deploy to GitHub Pages
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5
